<title>Kabelkompass</title>
<style>
  :root{
    --paper:#ffffff;
    --paper-raised:#f4f4f4;
    --ink:#141414;
    --ink-soft:#5c5c5c;
    --line:#dcdcdc;
    --accent:#141414;
    --accent-invert:#ffffff;
    --hue-fam:#8a5a2b;
    --hue-voltage:#b23a2e;
    --hue-insul:#2f5fa8;
    --hue-sheath:#9c7a12;
    --hue-special:#6a4c93;
    --hue-cond:#2f7d6b;
    --hue-count:#45606b;
    --hue-pe:#57731f;
    --hue-area:#8a3b5a;
    --shadow: 0 1px 2px rgba(0,0,0,.08), 0 6px 20px rgba(0,0,0,.08);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#121212;
      --paper-raised:#1c1c1c;
      --ink:#f0f0f0;
      --ink-soft:#a6a6a6;
      --line:#333333;
      --accent:#f0f0f0;
      --accent-invert:#121212;
      --hue-fam:#d3a15f;
      --hue-voltage:#e2776a;
      --hue-insul:#83aee0;
      --hue-sheath:#d9bd5a;
      --hue-special:#b79bd9;
      --hue-cond:#5fbba3;
      --hue-count:#8fb0bd;
      --hue-pe:#a7c65a;
      --hue-area:#c97ea3;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --paper:#121212;
    --paper-raised:#1c1c1c;
    --ink:#f0f0f0;
    --ink-soft:#a6a6a6;
    --line:#333333;
    --accent:#f0f0f0;
    --accent-invert:#121212;
    --hue-fam:#d3a15f;
    --hue-voltage:#e2776a;
    --hue-insul:#83aee0;
    --hue-sheath:#d9bd5a;
    --hue-special:#b79bd9;
    --hue-cond:#5fbba3;
    --hue-count:#8fb0bd;
    --hue-pe:#a7c65a;
    --hue-area:#c97ea3;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.4);
  }
  :root[data-theme="light"]{ color-scheme: light; }
  :root[data-theme="dark"]{ color-scheme: dark; }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  @media (prefers-reduced-motion: no-preference){ html{scroll-behavior:smooth;} }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"PT Sans", "Segoe UI", sans-serif;
    font-size:16px;
    line-height:1.55;
  }
  h1,h2,h3,.brand-title,.chapter-num,nav button{
    font-family:"Oswald","Arial Narrow",sans-serif;
  }
  h2{text-wrap:balance;}
  a{color:var(--ink);}
  code, .chip, .code-cell code{
    font-family:"IBM Plex Mono", ui-monospace, monospace;
  }
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  .app{ min-height:100vh; }

  /* ---------- Sidebar (slide-out drawer, all breakpoints) ---------- */
  #sidebar{
    background:var(--paper-raised);
    border-right:1px solid var(--line);
    padding: 22px 18px 32px;
    display:flex;
    flex-direction:column;
    gap:20px;
    position:fixed;
    top:0; left:0; bottom:0;
    width:min(300px, 84vw);
    z-index:40;
    overflow-y:auto;
    transform:translateX(-102%);
    transition:transform .22s ease;
    box-shadow:var(--shadow);
  }
  #sidebar.open{transform:translateX(0);}
  .scrim{
    display:none;
    position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:30;
  }
  .scrim.show{display:block;}

  .brand{display:flex; flex-direction:column; gap:4px;}
  .brand-title{
    font-size:24px; font-weight:600; letter-spacing:.03em; text-transform:uppercase;
    color:var(--ink);
  }
  .brand-sub{font-size:13px; color:var(--ink-soft); max-width:25ch;}

  .switch-row{display:flex; gap:6px;}
  .switch-row button{
    flex:1; padding:7px 0; border:1px solid var(--line); background:var(--paper);
    color:var(--ink-soft); font-size:12px; letter-spacing:.06em; border-radius:6px;
    cursor:pointer; font-weight:600;
  }
  .switch-row button.active{background:var(--accent); border-color:var(--accent); color:var(--accent-invert);}
  .switch-label{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px; display:block;}

  /* compact variant of the same switches, used inside the header */
  .switch-row.compact{gap:4px;}
  .switch-row.compact button{padding:5px 8px; font-size:11px;}

  .nav-group-label{
    font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft);
    margin-bottom:8px; display:block;
  }
  .topic-block{margin-bottom:6px;}
  .topic-head{
    font-size:14px; font-weight:600; color:var(--ink); padding:6px 2px; display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .badge-soon{
    font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft);
    border:1px solid var(--line); border-radius:20px; padding:2px 8px; white-space:nowrap;
  }
  .topic-block.disabled{opacity:.5;}
  .chapters{display:flex; flex-direction:column; gap:2px; margin-top:4px;}
  .chapters button{
    display:flex; align-items:baseline; gap:10px; text-align:left;
    background:none; border:none; border-left:2px solid transparent;
    padding:7px 8px; cursor:pointer; color:var(--ink); font-size:13.5px; font-family:inherit;
    border-radius:0 6px 6px 0;
  }
  .chapters button:hover{background:var(--paper);}
  .chapters button.active{border-left-color:var(--accent); background:var(--paper); font-weight:600;}
  .chapters .num{
    font-family:"IBM Plex Mono",monospace; color:var(--ink-soft); font-size:12px; flex:0 0 18px;
  }

  .sidebar-footer{margin-top:auto; font-size:11.5px; color:var(--ink-soft); line-height:1.5;}

  /* ---------- Header ---------- */
  #topbar{
    display:flex; align-items:center; gap:14px; row-gap:8px; flex-wrap:wrap;
    padding:12px 16px;
    border-bottom:1px solid var(--line); background:var(--paper-raised);
    position:sticky; top:0; z-index:20;
  }
  #menuBtn{
    background:none; border:1px solid var(--line); border-radius:6px; width:36px; height:36px;
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink);
    font-size:16px;
  }
  #topbarTitle{
    font-family:"Oswald","Arial Narrow",sans-serif; font-size:17px; font-weight:600;
    letter-spacing:.01em; color:var(--ink);
    flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  #topbarControls{display:flex; align-items:center; gap:10px; flex:0 0 auto; margin-left:auto;}

  @media (max-width: 600px){
    #topbar{padding:14px 16px; gap:10px; row-gap:10px;}
    #menuBtn{width:44px; height:44px; font-size:20px; border-radius:8px;}
    #topbarTitle{font-size:18px;}
    #topbarControls{gap:8px; width:100%; justify-content:space-between;}
    .switch-row.compact{gap:6px;}
    .switch-row.compact button{padding:9px 12px; font-size:13.5px; border-radius:7px;}
    .chapters button{padding:11px 8px; font-size:14.5px;}
    .topic-head{font-size:15px; padding:9px 2px;}
  }

  /* ---------- Main ---------- */
  main{padding: 40px clamp(16px,4vw,56px) 80px;}
  .content{max-width:760px; margin:0 auto;}
  h2.page-title{font-size:clamp(26px,3.6vw,34px); font-weight:600; margin:0 0 18px; letter-spacing:.01em;}
  .content p{margin:0 0 14px;}
  .content ul, .content ol{margin:0 0 16px; padding-left:22px;}
  .content li{margin-bottom:6px;}
  .note{
    background:var(--paper-raised); border:1px solid var(--line); border-left:3px solid var(--bar-color, var(--ink));
    padding:12px 14px; border-radius:6px; font-size:14.5px; color:var(--ink-soft); margin:16px 0;
  }
  .note b{color:var(--ink);}

  code{
    background:var(--ink); color:var(--paper); padding:2px 7px; border-radius:4px; font-size:.88em;
  }

  .table-wrap{overflow-x:auto; margin: 8px 0 20px; border:1px solid var(--line); border-radius:8px;}
  table.term-table{width:100%; border-collapse:collapse; font-size:14.5px; background:var(--paper-raised);}
  table.term-table th, table.term-table td{padding:9px 12px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top;}
  table.term-table thead th{
    font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); background:var(--paper);
    font-weight:600;
  }
  table.term-table tbody tr:last-child td{border-bottom:none;}
  table.term-table td.code-cell{white-space:nowrap; font-variant-numeric:tabular-nums;}
  table.term-table td.code-cell code{background:transparent; color:var(--code-hue, var(--ink)); padding:0; font-weight:600;}

  /* clickable designation-family pills */
  .pill{
    display:inline-flex; align-items:center; gap:6px; border:1px solid var(--ink); border-radius:999px;
    padding:5px 14px; font-family:"Oswald",sans-serif; font-size:13px; letter-spacing:.02em;
    color:var(--ink); background:transparent; cursor:pointer; text-decoration:none; margin:2px 6px 2px 0;
  }
  .pill:hover{background:var(--ink); color:var(--paper);}
  .pill-row{margin:14px 0 18px;}

  figure.diagram{
    margin: 18px 0 8px; padding:20px 16px 16px; border:1px solid var(--line); border-radius:10px;
    background-color:var(--paper-raised);
    background-image:
      repeating-linear-gradient(0deg, var(--line) 0 1px, transparent 1px 26px),
      repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 26px);
    overflow-x:auto;
  }
  figure.diagram svg{display:block; height:auto; margin:0 auto;}
  figure.diagram svg:not(.mega-diagram){width:100%; max-width:620px;}
  figure.diagram svg.mega-diagram{min-width:600px; max-width:760px; width:100%;}
  figure.diagram svg a{cursor:pointer;}
  figure.diagram svg a:hover rect, figure.diagram svg a:hover text{opacity:.68;}
  figure.diagram svg a:focus-visible rect{outline:2px solid currentColor; outline-offset:1px;}
  figure.diagram figcaption{
    margin-top:12px; font-size:13px; color:var(--ink-soft); text-align:center;
  }

  .cat-fam-bg{background:var(--hue-fam);}
  .cat-voltage-bg{background:var(--hue-voltage);}
  .cat-insul-bg{background:var(--hue-insul);}
  .cat-sheath-bg{background:var(--hue-sheath);}
  .cat-special-bg{background:var(--hue-special);}
  .cat-cond-bg{background:var(--hue-cond);}
  .cat-count-bg{background:var(--hue-count);}
  .cat-pe-bg{background:var(--hue-pe);}
  .cat-nope-bg{background:var(--ink-soft);}
  .cat-area-bg{background:var(--hue-area);}

  /* decoder */
  .decoder{border:1px solid var(--line); border-radius:10px; padding:18px 18px 20px; background:var(--paper-raised); margin:20px 0;}
  .decoder h4{margin:0 0 4px; font-size:16px; font-weight:600;}
  .decoder .hint{font-size:12.5px; color:var(--ink-soft); margin-bottom:14px;}
  .decoder-row{display:flex; gap:8px; flex-wrap:wrap;}
  .decoder-row input{
    flex:1; min-width:180px; padding:10px 12px; border:1px solid var(--line); border-radius:6px;
    background:var(--paper); color:var(--ink); font-family:"IBM Plex Mono",monospace; font-size:14px;
  }
  .decoder-row button{
    padding:10px 18px; border:none; border-radius:6px; background:var(--accent); color:var(--accent-invert);
    font-weight:600; cursor:pointer; font-family:"Oswald",sans-serif; letter-spacing:.03em;
  }
  .decoder-row button:hover{opacity:.85;}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin:16px 0 4px;}
  .chip{
    padding:7px 12px; border-radius:6px; font-weight:600; font-size:15px; color:var(--paper);
    box-shadow: var(--shadow);
  }
  .chip.outline{background:transparent; border:1.5px dashed var(--ink-soft); color:var(--ink-soft); font-style:italic; font-weight:400;}
  .explain-list{list-style:none; padding:0; margin:14px 0 0; display:flex; flex-direction:column; gap:6px; font-size:14px;}
  .explain-list li{display:flex; gap:8px;}
  .explain-list code{flex:0 0 auto;}
  .decoder-notes{margin-top:10px; font-size:13px; color:var(--ink-soft); font-style:italic;}

  /* cheat sheet cards */
  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin:12px 0 24px;}
  .card{border:1px solid var(--line); border-radius:10px; padding:14px 14px 12px; background:var(--paper-raised);}
  .card h4{margin:0 0 8px; font-size:12px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-soft); font-weight:700;}
  .card ul{margin:0; padding-left:0; list-style:none;}
  .card li{display:flex; justify-content:space-between; gap:10px; padding:4px 0; border-bottom:1px dashed var(--line); font-size:13.5px;}
  .card li:last-child{border-bottom:none;}
  .card li code{white-space:nowrap;}

  /* glossary */
  dl.glossary{margin:0;}
  dl.glossary .entry{padding:14px 0; border-bottom:1px solid var(--line);}
  dl.glossary .entry:first-child{padding-top:0;}
  dl.glossary dt{font-weight:700; font-size:15.5px; margin-bottom:4px; display:flex; gap:8px; align-items:baseline;}
  dl.glossary dt .term-code{font-family:"IBM Plex Mono",monospace; color:var(--ink); font-size:13px; font-weight:600;}
  dl.glossary dd{margin:0; color:var(--ink-soft); font-size:14.5px;}

  /* tree diagram (national vs harmonized) */
  .tree{display:flex; flex-direction:column; align-items:center; padding:20px 6px 6px;}
  .tree .root{
    border:1px solid var(--line); background:var(--paper-raised); border-radius:8px; padding:8px 16px;
    font-family:"Oswald",sans-serif; font-size:13px; letter-spacing:.03em; text-transform:uppercase;
  }
  .tree .stem{width:1px; height:22px; background:var(--line);}
  .tree .branches{display:flex; gap:0; width:100%; max-width:460px; justify-content:space-between; position:relative;}
  .tree .branches::before{
    content:""; position:absolute; top:0; left:12%; right:12%; height:1px; background:var(--line);
  }
  .branch{display:flex; flex-direction:column; align-items:center; gap:10px; flex:1;}
  .branch .connector{width:1px; height:20px; background:var(--line);}
  .branch .box{
    border:1px solid var(--line); border-top:3px solid var(--ink); background:var(--paper-raised);
    border-radius:8px; padding:9px 14px; font-family:"Oswald",sans-serif; font-size:13px; text-align:center;
  }
  .branch.national .box{border-top-style:dashed; border-top-color:var(--ink-soft);}
  .branch .examples{display:flex; flex-direction:column; gap:4px; align-items:center;}
  .branch .examples code{font-size:12px;}

  /* subsection blocks on the Kennzeichnung page */
  .spec-block{position:relative; padding-left:20px; margin:34px 0 30px; scroll-margin-top:120px;}
  .spec-block::before{content:""; position:absolute; left:0; top:3px; bottom:3px; width:3px; border-radius:2px; background:var(--bar-color, var(--line));}
  .spec-block h3{font-size:19px; font-weight:600; margin:0 0 10px; letter-spacing:.01em;}
  #mega{scroll-margin-top:120px;}
  #sec-national{scroll-margin-top:120px;}

  .page-footer{
    display:flex; justify-content:flex-end; margin-top:40px; padding-top:20px; border-top:1px solid var(--line);
  }
  .page-footer button{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:8px; padding:10px 18px;
    cursor:pointer; color:var(--ink); font-family:"Oswald",sans-serif; font-size:13.5px; letter-spacing:.03em;
  }
  .page-footer button:hover{border-color:var(--ink);}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=PT+Sans:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<div class="scrim" id="scrim"></div>
<div id="topbar">
  <button id="menuBtn" aria-expanded="false">&#9776;</button>
  <div id="topbarTitle"></div>
  <div id="topbarControls"></div>
</div>

<div class="app">
  <aside id="sidebar" aria-label="Navigation"></aside>
  <main><div class="content" id="mainContent"></div></main>
</div>

<script>
(function(){
  "use strict";

  /* ================= DATA ================= */

  var VOLTAGE = [
    {code:'01', label:{ru:'100 В', de:'100 V', en:'100 V'}},
    {code:'03', label:{ru:'300/300 В', de:'300/300 V', en:'300/300 V'}},
    {code:'05', label:{ru:'300/500 В', de:'300/500 V', en:'300/500 V'}},
    {code:'07', label:{ru:'450/750 В', de:'450/750 V', en:'450/750 V'}}
  ];

  var MATERIALS = [
    {code:'V',  de:'Polyvinylchlorid (PVC)',        ru:'ПВХ (поливинилхлорид)',              en:'PVC (polyvinyl chloride)'},
    {code:'V2', de:'wärmebeständiges PVC',           ru:'термостойкий ПВХ',                    en:'heat-resistant PVC'},
    {code:'V3', de:'kältebeständiges PVC',           ru:'холодостойкий ПВХ',                   en:'cold-resistant PVC'},
    {code:'V4', de:'vernetztes PVC',                 ru:'сшитый ПВХ',                           en:'cross-linked PVC'},
    {code:'R',  de:'Natur-/Synthesekautschuk',       ru:'натуральный/синтетический каучук',    en:'natural/synthetic rubber'},
    {code:'N',  de:'Polychloropren (Spezial-Elastomer)', ru:'полихлоропрен (спецэластомер)',   en:'polychloroprene (special elastomer)'},
    {code:'S',  de:'Silikonkautschuk',               ru:'силиконовый каучук',                  en:'silicone rubber'},
    {code:'Z',  de:'halogenfreier Thermoplast',      ru:'безгалогенный термопласт',            en:'halogen-free thermoplastic'},
    {code:'B',  de:'EPR (Ethylen-Propylen-Kautschuk)', ru:'этилен-пропиленовый каучук (EPR)',  en:'EPR (ethylene-propylene rubber)'},
    {code:'G',  de:'EVA (Ethylen-Vinylacetat)',      ru:'этиленвинилацетат (EVA)',              en:'EVA (ethylene-vinyl acetate)'}
  ];

  var CONDUCTORS = [
    {code:'U', de:'eindrähtig, starr',                 ru:'однопроволочная, жёсткая',                          en:'solid, single-wire'},
    {code:'R', de:'mehrdrähtig, rund',                 ru:'многопроволочная, круглая',                          en:'stranded, round'},
    {code:'K', de:'feindrähtig, feste Verlegung',      ru:'гибкая многопроволочная, для стационарной прокладки', en:'flexible fine-wire, fixed installation'},
    {code:'F', de:'feindrähtig, flexibel',             ru:'гибкая многопроволочная',                            en:'flexible fine-wire'},
    {code:'H', de:'feinstdrähtig',                     ru:'особо тонкопроволочная',                             en:'extra-fine-wire'},
    {code:'D', de:'feindrähtig, Schweißleitung',       ru:'гибкая жила для сварочных кабелей',                  en:'fine-wire, welding cable'},
    {code:'E', de:'feinstdrähtig, Schweißleitung',     ru:'особо гибкая сварочная жила',                        en:'extra-fine-wire, welding cable'}
  ];

  var SPECIALS = [
    {code:'H2', de:'flach, nicht aufteilbar',                     ru:'плоская, неразделяемая конструкция',                 en:'flat, non-divisible'},
    {code:'H6', de:'flach, nicht aufteilbar, mehr-/vieladrig',    ru:'плоская, неразделяемая, много-/многожильная',        en:'flat, non-divisible, multi-core'},
    {code:'H7', de:'zweischichtige Isolierhülle',                 ru:'двухслойная изоляционная оболочка',                  en:'two-layer insulation sheath'},
    {code:'H8', de:'Wendelleitung',                               ru:'спиральный (витой) провод',                          en:'coiled / spiral cord'}
  ];

  var FIRST_LETTER = [
    {code:'H', de:'harmonisiert',        ru:'гармонизированный тип',        en:'harmonized type'},
    {code:'A', de:'national anerkannt',  ru:'национально признанный тип',   en:'nationally recognized type'},
    {code:'N', de:'nationale Norm',      ru:'национальный стандарт',        en:'national standard'},
    {code:'X', de:'Sondertype',          ru:'специальный тип',              en:'special type'}
  ];

  var CAPTIONS = {
    cap_fam:     {ru:'семейство',          de:'Familie',        en:'family'},
    cap_voltage: {ru:'напряжение',         de:'Spannung',       en:'voltage'},
    cap_insul:   {ru:'изоляция',           de:'Isolation',      en:'insulation'},
    cap_sheath:  {ru:'оболочка',           de:'Mantel',         en:'sheath'},
    cap_special: {ru:'особая форма',       de:'Sonderform',     en:'special shape'},
    cap_cond:    {ru:'конструкция жилы',   de:'Aderaufbau',     en:'conductor type'},
    cap_count:   {ru:'число жил',          de:'Aderzahl',       en:'core count'},
    cap_pe:      {ru:'c PE',               de:'mit PE',         en:'with PE'},
    cap_area:    {ru:'сечение, мм²',       de:'Querschnitt, mm²', en:'cross-section, mm²'},
    megaAria: {
      ru:'Синтетический код, объединяющий все позиции гармонизированного обозначения: H, напряжение, изоляция, оболочка, особая форма, конструкция жилы, число жил, PE, сечение',
      de:'Synthetischer Code mit allen Positionen der harmonisierten Bezeichnung: H, Spannung, Isolation, Mantel, Sonderform, Aderaufbau, Aderzahl, PE, Querschnitt',
      en:'A synthetic code combining every position of the harmonized designation: H, voltage, insulation, sheath, special shape, conductor type, core count, PE, cross-section'
    }

  function wireDecoder(id, lang){
    var root = document.getElementById(id);
    if (!root) return;
    var input = root.querySelector('.dec-input');
    var btn = root.querySelector('.dec-btn');
    var out = root.querySelector('.dec-output');
    function run(){ renderDecoded(out, decode(input.value), lang); }
    btn.addEventListener('click', run);
    input.addEventListener('keydown', function(e){ if(e.key==='Enter'){ run(); } });
    run();
  }

  function decode(raw){
    var segs = [], notes = [];
    var s = (raw||'').trim().toUpperCase().replace(/\s+/g,' ');
    if (!s) return {segs:segs, notes:notes};
    var parts = s.split(' ');
    var designation = parts[0];
    var coreSpec = parts.slice(1).join(' ');
    var rest = designation;

    if (rest.charAt(0) !== 'H'){
      segs.push({cat:'unknown', text:designation});
      notes.push('family');
    } else {
      segs.push({cat:'fam', text:'H'});
      rest = rest.slice(1);
      var vm = rest.match(/^(01|03|05|07)/);
      if (vm){ segs.push({cat:'voltage', text:vm[0]}); rest = rest.slice(2); }
      else { notes.push('voltage'); }

      var matCodes = MATERIALS.map(function(m){return m.code;}).sort(function(a,b){return b.length-a.length;});
      var matCount = 0;
      while (matCount < 2 && rest.length && rest.charAt(0) !== '-' && !/^H[2678]/.test(rest)){
        var found = null;
        for (var i=0;i<matCodes.length;i++){ if (rest.indexOf(matCodes[i])===0){ found = matCodes[i]; break; } }
        if (!found) break;
        segs.push({cat: matCount===0 ? 'insul' : 'sheath', text: found});
        rest = rest.slice(found.length);
        matCount++;
      }

      var sm = rest.match(/^H[2678]/);
      if (sm){ segs.push({cat:'special', text: sm[0]}); rest = rest.slice(sm[0].length); }

      if (rest.charAt(0) === '-'){
        rest = rest.slice(1);
        var cm = rest.match(/^[URKFHDE]/);
        if (cm){ segs.push({cat:'cond', text:'-'+cm[0]}); rest = rest.slice(1); }
        else { notes.push('conductor'); }
      } else if (rest.length){
        notes.push('tail');
      }
      if (rest.length){ segs.push({cat:'unknown', text: rest}); }
    }

    if (coreSpec){
      var m = coreSpec.match(/^(\d+)([GX])([\d.,]+)/);
      if (m){
        segs.push({cat:'count', text:m[1]});
        segs.push({cat: m[2]==='G' ? 'pe' : 'nope', text:m[2]});
        segs.push({cat:'area', text:m[3]});
      } else {
        segs.push({cat:'unknown', text:coreSpec});
        notes.push('core');
      }
    }
    return {segs:segs, notes:notes};
  }

  function explainSegment(seg, lang){
    switch(seg.cat){
      case 'fam': return UI.explFam[lang];
      case 'voltage': { var v = VOLTAGE.filter(function(x){return x.code===seg.text;})[0]; return v ? v.label[lang] : UI.explUnknown[lang]; }
      case 'insul': { var mi = MATERIALS.filter(function(x){return x.code===seg.text;})[0]; return mi ? (UI.roleInsul[lang]+': '+(lang==='de'?mi.de:mi[lang])) : UI.explUnknown[lang]; }
      case 'sheath': { var ms = MATERIALS.filter(function(x){return x.code===seg.text;})[0]; return ms ? (UI.roleSheath[lang]+': '+(lang==='de'?ms.de:ms[lang])) : UI.explUnknown[lang]; }
      case 'special': { var sp = SPECIALS.filter(function(x){return x.code===seg.text;})[0]; return sp ? (lang==='de'?sp.de:sp[lang]) : UI.explUnknown[lang]; }
      case 'cond': { var code = seg.text.replace('-',''); var c = CONDUCTORS.filter(function(x){return x.code===code;})[0]; return c ? (lang==='de'?c.de:c[lang]) : UI.explUnknown[lang]; }
      case 'count': return UI.explCount[lang];
      case 'pe': return UI.explPe[lang];
      case 'nope': return UI.explNope[lang];
      case 'area': return UI.explArea[lang];
      case 'unknown': return UI.explUnknown[lang];
    }
    return '';
  }

  function renderDecoded(out, result, lang){
    if (!result.segs.length){ out.innerHTML = ''; return; }
    var chips = result.segs.map(function(seg){
      if (seg.cat === 'unknown'){ return '<span class="chip outline">'+seg.text+'</span>'; }
      return '<span class="chip cat-'+seg.cat+'-bg">'+seg.text+'</span>';
    }).join('');
    var explains = result.segs.map(function(seg){
      return '<li><code>'+seg.text+'</code><span>'+explainSegment(seg, lang)+'</span></li>';
    }).join('');
    var noteMap = {family:UI.noteFamily, voltage:UI.noteVoltage, conductor:UI.noteConductor, tail:UI.noteTail, core:UI.noteCore};
    var notesHtml = result.notes.map(function(n){ return noteMap[n] ? '<div>'+noteMap[n][lang]+'</div>' : ''; }).join('');
    out.innerHTML = '<div class="chips">'+chips+'</div>'+
      '<ul class="explain-list">'+explains+'</ul>'+
      (notesHtml ? '<div class="decoder-notes">'+notesHtml+'</div>' : '');
  }

      '<p>'+cheatIntro[lang]+'</p><div class="cards">'+cardVoltage+cardMat+cardCond+cardCount+'</div></div>';

    return '<h2 class="page-title">'+UI.pageSigns[lang]+'</h2>'+
      intro + mega +

  }

  /* ================= PAGE 3: PRACTICAL EXERCISE — RING TERMINAL ================= */

  function renderPracticePage(lang){
    var title = {ru:'Кольцевая клемма из жилы провода', de:'Ringöse aus der Volldraht-Ader', en:'Ring terminal from the solid core'};
    var intro = {
      ru:'Задание: изготовить отрезок провода, у которого жила на обоих концах свёрнута в замкнутое кольцо — самодельную кольцевую клемму под винт с гайкой. Отдельная гильза или кабельный наконечник не используются: кольцо гнётся из собственной жилы провода.',
      de:'Aufgabe: ein Leitungsstück anfertigen, dessen Ader an beiden Enden zu einer geschlossenen Öse gebogen wird — eine selbst gebogene Ringöse für eine Schraub-Mutter-Verbindung. Es wird keine separate Aderendhülse oder kein Kabelschuh verwendet: die Öse entsteht aus der Ader selbst.',
      en:'Task: make a wire segment whose core is bent, at both ends, into a closed loop — a hand-formed ring terminal for a screw-and-nut connection. No separate ferrule or lug is used: the ring is bent from the wire’s own conductor.'
    };
    var givenLabel = {ru:'Исходные данные', de:'Gegebene Werte', en:'Given'};
    var givenList = {
      ru:['диаметр жилы d = 1,5 мм','требуемый внутренний радиус кольца R<sub>вн</sub> = 4 мм','прямой участок перед загибом ≈ 2,5 мм (среднее между 2 и 3 мм)'],
      de:['Aderdurchmesser d = 1,5 mm','geforderter Innenradius der Öse R<sub>i</sub> = 4 mm','gerades Stück vor der Biegung ≈ 2,5 mm (Mittel aus 2 und 3 mm)'],
      en:['core diameter d = 1.5 mm','required ring inner radius R<sub>i</sub> = 4 mm','straight run before the bend ≈ 2.5 mm (average of 2 and 3 mm)']

    // ---- overview diagram ----
    var overviewCap = {
      ru:'Общий вид: кольцо на каждом конце, изолированный участок — произвольной длины (отмечен разрывом).',
      de:'Gesamtansicht: an jedem Ende eine Öse, der isolierte Abschnitt hat beliebige Länge (durch Bruchlinie markiert).',
      en:'Overview: a ring at each end, the insulated span has arbitrary length (marked with a break line).'
    };
    var lNeeded = {ru:'L — по потребности', de:'L — nach Bedarf', en:'L — as needed'};
    var overviewSvg = ''+
      '<svg viewBox="0 0 340 90" role="img" aria-label="'+escXml(overviewCap[lang])+'">'+
        '<circle cx="30" cy="45" r="16" fill="none" stroke="currentColor" stroke-width="5"></circle>'+
        '<line x1="46" y1="45" x2="72" y2="45" stroke="currentColor" stroke-width="5" stroke-linecap="round"></line>'+
        '<rect x="72" y="37" width="196" height="16" rx="3" fill="var(--paper-raised)" stroke="currentColor" stroke-width="1.2"></rect>'+
        '<rect x="163" y="33" width="14" height="24" fill="var(--paper-raised)"></rect>'+
        '<line x1="162" y1="33" x2="172" y2="57" stroke="currentColor" stroke-width="1.2"></line>'+
        '<line x1="172" y1="33" x2="182" y2="57" stroke="currentColor" stroke-width="1.2"></line>'+
        '<line x1="268" y1="45" x2="294" y2="45" stroke="currentColor" stroke-width="5" stroke-linecap="round"></line>'+
        '<circle cx="310" cy="45" r="16" fill="none" stroke="currentColor" stroke-width="5"></circle>'+
        '<text x="170" y="80" text-anchor="middle" font-family="PT Sans, sans-serif" font-size="12" fill="currentColor">'+escXml(lNeeded[lang])+'</text>'+
      '</svg>';

    // ---- detail diagram (one end, fully dimensioned) ----
    var detailCap = {
      ru:'Деталь одного конца: прямой участок 2,5 мм → загиб 90° (r = d) → кольцо (R по осевой линии 4,75 мм, внутренний радиус 4 мм). Второй конец — зеркально.',
      de:'Detail eines Endes: gerades Stück 2,5 mm → 90°-Biegung (r = d) → Öse (Radius der neutralen Faser 4,75 mm, Innenradius 4 mm). Das zweite Ende ist spiegelbildlich.',
      en:'Detail of one end: 2.5 mm straight run → 90° bend (r = d) → ring (neutral-axis radius 4.75 mm, inner radius 4 mm). The other end is a mirror image.'
    };
    var lblRmean = {ru:'Rₑᵣ = 4,75 мм (осевая линия)', de:'Rm = 4,75 mm (neutrale Faser)', en:'Rm = 4.75 mm (neutral axis)'};
    var lblRin = {ru:'Rᵥₙ = 4 мм', de:'Ri = 4 mm', en:'Ri = 4 mm'};
    var lblAngle = {ru:'90°', de:'90°', en:'90°'};
    var lblBendR = {ru:'r = d = 1,5 мм', de:'r = d = 1,5 mm', en:'r = d = 1.5 mm'};
    var lblStraight = {ru:'2,5 мм', de:'2,5 mm', en:'2.5 mm'};
    var lblDia = {ru:'⌀ d = 1,5 мм', de:'⌀ d = 1,5 mm', en:'⌀ d = 1.5 mm'};
    var lblSeam = {ru:'шов: подрезать встык', de:'Stoß: bündig nacharbeiten', en:'seam: trim flush'};
    var lblIns = {ru:'изоляция', de:'Isolierung', en:'insulation'};

    var detailSvg = ''+
      '<svg viewBox="0 0 380 300" role="img" aria-label="'+escXml(detailCap[lang])+'">'+
        '<defs><marker id="prArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">'+
          '<path d="M0,0 L10,5 L0,10 z" fill="currentColor"></path></marker></defs>'+

        // insulation tube + break marks
        '<rect x="25" y="213" width="85" height="14" rx="3" fill="var(--paper-raised)" stroke="currentColor" stroke-width="1.2"></rect>'+
        '<rect x="57" y="209" width="10" height="22" fill="var(--paper-raised)"></rect>'+
        '<line x1="55" y1="230" x2="63" y2="206" stroke="currentColor" stroke-width="1.2"></line>'+
        '<line x1="63" y1="230" x2="71" y2="206" stroke="currentColor" stroke-width="1.2"></line>'+
        '<text x="67" y="200" text-anchor="middle" font-family="PT Sans, sans-serif" font-size="10.5" fill="currentColor">'+escXml(lblIns[lang])+'</text>'+

        // bare wire: straight run -> 90deg bend -> full ring
        '<path d="M 110 220 L 130 220 A 12 12 0 0 1 118 208 A 38 38 0 0 1 118 132 A 38 38 0 0 1 118 208" '+
          'fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"></path>'+

        // R_mean dimension (straight up to top of ring)
        '<line x1="118" y1="170" x2="118" y2="134" stroke="currentColor" stroke-width="1" marker-end="url(#prArrow)"></line>'+
        '<text x="118" y="122" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11.5" fill="currentColor">'+escXml(lblRmean[lang])+'</text>'+

        // R_in dimension (diagonal)
        '<line x1="118" y1="170" x2="141" y2="150" stroke="currentColor" stroke-width="1" marker-end="url(#prArrow)"></line>'+
        '<text x="146" y="150" text-anchor="start" font-family="IBM Plex Mono, monospace" font-size="11.5" fill="currentColor">'+escXml(lblRin[lang])+'</text>'+

        // 90 degree angle marker
        '<path d="M 110 220 A 20 20 0 0 1 130 200" fill="none" stroke="currentColor" stroke-width="1"></path>'+
        '<text x="103" y="200" text-anchor="middle" font-family="PT Sans, sans-serif" font-size="11" fill="currentColor">'+escXml(lblAngle[lang])+'</text>'+

        // bend radius callout
        '<line x1="126" y1="213" x2="172" y2="203" stroke="currentColor" stroke-width="1"></line>'+
        '<text x="176" y="206" text-anchor="start" font-family="PT Sans, sans-serif" font-size="11" fill="currentColor">'+escXml(lblBendR[lang])+'</text>'+

        // straight-run dimension
        '<line x1="110" y1="222" x2="110" y2="246" stroke="currentColor" stroke-width="1"></line>'+
        '<line x1="130" y1="222" x2="130" y2="246" stroke="currentColor" stroke-width="1"></line>'+
        '<line x1="110" y1="243" x2="130" y2="243" stroke="currentColor" stroke-width="1" marker-end="url(#prArrow)" marker-start="url(#prArrow)"></line>'+
        '<text x="120" y="259" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11.5" fill="currentColor">'+escXml(lblStraight[lang])+'</text>'+

        // cross-section inset
        '<line x1="255" y1="222" x2="132" y2="219" stroke="currentColor" stroke-width="0.75" stroke-dasharray="3,3"></line>'+
        '<circle cx="266" cy="224" r="10" fill="none" stroke="currentColor" stroke-width="1.2"></circle>'+
        '<circle cx="266" cy="224" r="2" fill="currentColor"></circle>'+
        '<text x="266" y="248" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11.5" fill="currentColor">'+escXml(lblDia[lang])+'</text>'+

        // seam callout
        '<line x1="118" y1="208" x2="185" y2="190" stroke="currentColor" stroke-width="0.75" stroke-dasharray="3,3"></line>'+
        '<text x="190" y="193" text-anchor="start" font-family="PT Sans, sans-serif" font-size="10.5" fill="currentColor">'+escXml(lblSeam[lang])+'</text>'+
      '</svg>';

    // ---- results table ----
    var thParam = {ru:'Параметр', de:'Parameter', en:'Parameter'};
    var thFormula = {ru:'Формула', de:'Formel', en:'Formula'};
    var thValue = {ru:'Значение', de:'Wert', en:'Value'};
    var rows = [
      [{ru:'Диаметр жилы, d',de:'Aderdurchmesser, d',en:'Core diameter, d'}, {ru:'дано',de:'gegeben',en:'given'}, '1,5 мм / 1.5 mm'],
      [{ru:'Внутренний радиус кольца, Rᵥₙ',de:'Innenradius der Öse, Ri',en:'Ring inner radius, Ri'}, {ru:'дано',de:'gegeben',en:'given'}, '4 мм / 4 mm'],
      [{ru:'Радиус по осевой линии, Rₑᵣ',de:'Radius der neutralen Faser, Rm',en:'Neutral-axis radius, Rm'}, 'Rᵥₙ + d/2', '4,75 мм / 4.75 mm'],
      [{ru:'Длина кольца по осевой линии, L',de:'Länge der Öse (neutrale Faser), L',en:'Ring length (neutral axis), L'}, '2πRₑᵣ', '≈29,85 мм (≈30 мм)'],
      [{ru:'Прямой участок до загиба',de:'Gerades Stück vor der Biegung',en:'Straight run before the bend'}, {ru:'принято',de:'angenommen',en:'assumed'}, '2,5 мм / 2.5 mm'],
      [{ru:'Дуга загиба 90° (r = d)',de:'Bogen der 90°-Biegung (r = d)',en:'90° bend arc (r = d)'}, '(2πr)/4', '≈2,36 мм / 2.36 mm'],
      [{ru:'Зачистка на один конец, всего',de:'Abisolierlänge je Ende, gesamt',en:'Strip length per end, total'}, {ru:'сумма строк 4–6',de:'Summe der Zeilen 4–6',en:'sum of rows 4–6'}, '≈34,7 мм / 34.7 mm'],
      [{ru:'Рекомендуемый запас на подрезку',de:'Empfohlene Schnittzugabe',en:'Recommended cutting margin'}, {ru:'практика',de:'Praxis',en:'practice'}, {ru:'+1,5–2 мм (резать ≈36–37 мм)',de:'+1,5–2 mm (≈36–37 mm schneiden)',en:'+1.5–2 mm (cut ≈36–37 mm)'}]
    ];
    var tableRows = rows.map(function(r){
      var p = typeof r[0]==='object' ? r[0][lang] : r[0];
      var f = typeof r[1]==='object' ? r[1][lang] : r[1];
      var v = typeof r[2]==='object' ? r[2][lang] : r[2];
      return '<tr><td>'+p+'</td><td class="code-cell"><code>'+f+'</code></td><td class="code-cell"><code>'+v+'</code></td></tr>';
    }).join('');
    var resultsTable = '<div class="table-wrap"><table class="term-table"><thead><tr><th>'+thParam[lang]+'</th><th>'+thFormula[lang]+'</th><th>'+thValue[lang]+'</th></tr></thead><tbody>'+tableRows+'</tbody></table></div>';

    // ---- process notes ----
    var steps = [
      {ru:'Сначала полностью согните жилу: прямой участок → загиб на 90° → кольцо.',
       de:'Zuerst die Ader vollständig biegen: gerades Stück → 90°-Biegung → Öse.',
       en:'First fully bend the core: straight run → 90° bend → ring.'},
      {ru:'Только после этого зачищайте и подрезайте кончики — если снять изоляцию заранее, инструмент при формировании угла может повредить оголённую жилу.',
       de:'Erst danach die Enden abisolieren und nachschneiden — wird die Isolierung vorher entfernt, kann das Werkzeug die blanke Ader beim Biegen des Winkels beschädigen.',
       en:'Only afterward strip and trim the tips — stripping first risks the tool damaging the bare core while forming the bend.'},
      {ru:'Заготовку на кольцо отрезайте с запасом (≈31–32 мм по длине окружности), а после изгиба подрезайте стык кусачками или напильником для плотной подгонки встык.',
       de:'Den Ring-Rohling mit Zugabe schneiden (≈31–32 mm Umfang) und nach dem Biegen die Stoßstelle mit Seitenschneider oder Feile für einen sauberen Stumpfstoß nacharbeiten.',
       en:'Cut the ring blank with margin (≈31–32 mm of circumference) and, after bending, trim the joint with cutters or a file for a clean butt fit.'},
      {ru:'Длина изолированного участка чертежом не регламентируется — подбирается по месту установки.',
       de:'Die Länge des isolierten Abschnitts ist in der Zeichnung nicht festgelegt — sie richtet sich nach dem Einbauort.',
       en:'The insulated section’s length isn’t fixed by this drawing — choose it to fit the installation.'}
    ];
    var stepsHtml = '<ol>'+steps.map(function(s){ return '<li>'+s[lang]+'</li>'; }).join('')+'</ol>';
    var stepsTitle = {ru:'Порядок работы', de:'Arbeitsablauf', en:'Process'};
    var resultsTitle = {ru:'Расчёт размеров', de:'Maßberechnung', en:'Dimension calculations'};

    return '<h2 class="page-title">'+title[lang]+'</h2>'+
      '<p>'+intro[lang]+'</p>'+
      '<div class="note"><b>'+givenLabel[lang]+':</b><ul style="margin:8px 0 0;">'+
        givenList[lang].map(function(g){ return '<li>'+g+'</li>'; }).join('')+
      '</ul></div>'+
      '<figure class="diagram">'+overviewSvg+'<figcaption>'+overviewCap[lang]+'</figcaption></figure>'+
      '<figure class="diagram">'+detailSvg+'<figcaption>'+detailCap[lang]+'</figcaption></figure>'+
      '<h3 style="font-size:19px;font-weight:600;margin:30px 0 10px;">'+resultsTitle[lang]+'</h3>'+
      resultsTable+
      '<h3 style="font-size:19px;font-weight:600;margin:30px 0 10px;">'+stepsTitle[lang]+'</h3>'+
      stepsHtml;
  }

  /* ================= APP STATE / RENDER ================= */

  var PAGES = ['terms','signs','practice'];
  var state = { lang: 'ru', page: 'terms', theme: 'auto' };
  try {
    var savedLang = localStorage.getItem('kk-lang');
    if (savedLang) state.lang = savedLang;
    var savedPage = localStorage.getItem('kk-page');
    if (savedPage && PAGES.indexOf(savedPage) !== -1) state.page = savedPage;
    var savedTheme = localStorage.getItem('kk-theme');
    if (savedTheme === 'light' || savedTheme === 'dark' || savedTheme === 'auto') state.theme = savedTheme;
  } catch(e){}

  function persist(){
    try {
      localStorage.setItem('kk-lang', state.lang);
      localStorage.setItem('kk-page', state.page);
      localStorage.setItem('kk-theme', state.theme);
    } catch(e){}
  }

  function applyTheme(){
    if (state.theme === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', state.theme);
  }

  function currentPageTitle(){
    return state.page === 'terms' ? UI.pageTerms[state.lang]
      : state.page === 'signs' ? UI.pageSigns[state.lang]
      : UI.pagePractice[state.lang];
  }

  function renderSidebar(){
    var sb = document.getElementById('sidebar');
    function pageBtnsHtml(list){
      return list.map(function(p, i){
        return '<button data-page="'+p.id+'" class="'+(state.page===p.id?'active':'')+'">'+
          '<span class="num">0'+(i+1)+'</span><span>'+p.title+'</span></button>';
      }).join('');
    }
    var kennzeichnungBtns = pageBtnsHtml([
      {id:'terms', title:UI.pageTerms[state.lang]},
      {id:'signs', title:UI.pageSigns[state.lang]}
    ]);
    var practiceBtns = pageBtnsHtml([
      {id:'practice', title:UI.pagePractice[state.lang]}
    ]);

    sb.innerHTML =
      '<div class="brand"><div class="brand-title">Kabelkompass</div>'+
      '<div class="brand-sub">'+UI.subtitle[state.lang]+'</div></div>'+
      '<div>'+
        '<span class="nav-group-label">'+UI.topics[state.lang]+'</span>'+
        '<div class="topic-block">'+
          '<div class="topic-head">'+UI.topic1[state.lang]+'</div>'+
          '<div class="chapters">'+kennzeichnungBtns+'</div>'+
        '</div>'+
        '<div class="topic-block">'+
          '<div class="topic-head">'+UI.topic3[state.lang]+'</div>'+
          '<div class="chapters">'+practiceBtns+'</div>'+
        '</div>'+
        '<div class="topic-block disabled">'+
          '<div class="topic-head">'+UI.topic2[state.lang]+'<span class="badge-soon">'+UI.soon[state.lang]+'</span></div>'+
        '</div>'+
      '</div>'+
      '<div class="sidebar-footer">'+UI.footer[state.lang]+'</div>';

    sb.querySelectorAll('.chapters button[data-page]').forEach(function(b){
      b.addEventListener('click', function(){
        state.page = b.getAttribute('data-page'); persist();
        closeNav();
        renderAll();
        window.scrollTo({top:0, behavior:'auto'});
      });
    });
  }

  function renderTopbar(){
    var titleEl = document.getElementById('topbarTitle');
    var controlsEl = document.getElementById('topbarControls');
    titleEl.textContent = currentPageTitle();

    var langBtns = ['ru','de','en'].map(function(l){
      return '<button data-lang="'+l+'" class="'+(state.lang===l?'active':'')+'">'+l.toUpperCase()+'</button>';
    }).join('');
    var themeBtns = [
      {v:'auto', sym:'&#9680;', title:UI.themeAuto[state.lang]},
      {v:'light', sym:'&#9675;', title:UI.themeLight[state.lang]},
      {v:'dark', sym:'&#9679;', title:UI.themeDark[state.lang]}
    ].map(function(o){
      return '<button data-theme-choice="'+o.v+'" class="'+(state.theme===o.v?'active':'')+'" title="'+o.title+'" aria-label="'+o.title+'">'+o.sym+'</button>';
    }).join('');

    controlsEl.innerHTML =
      '<div class="switch-row compact">'+langBtns+'</div>'+
      '<div class="switch-row compact">'+themeBtns+'</div>';

    controlsEl.querySelectorAll('button[data-lang]').forEach(function(b){
      b.addEventListener('click', function(){ state.lang = b.getAttribute('data-lang'); persist(); renderAll(); });
    });
    controlsEl.querySelectorAll('button[data-theme-choice]').forEach(function(b){
      b.addEventListener('click', function(){ state.theme = b.getAttribute('data-theme-choice'); persist(); applyTheme(); renderTopbar(); });
    });

    document.getElementById('menuBtn').setAttribute('aria-label', UI.menuLabel[state.lang]);
  }

  function renderMain(){
    var content = document.getElementById('mainContent');
    content.innerHTML = state.page === 'terms' ? renderTermsPage(state.lang)
      : state.page === 'signs' ? renderSignsPage(state.lang)
      : renderPracticePage(state.lang);

    var goSigns = content.querySelector('.go-signs');
    if (goSigns) goSigns.addEventListener('click', function(){ state.page='signs'; persist(); renderAll(); window.scrollTo({top:0}); });
    var goTerms = content.querySelector('.go-terms');
    if (goTerms) goTerms.addEventListener('click', function(){ state.page='terms'; persist(); renderAll(); window.scrollTo({top:0}); });

    document.documentElement.lang = state.lang;
  }

  function renderAll(){ renderSidebar(); renderTopbar(); renderMain(); }

  function setMenuIcon(open){
    document.getElementById('menuBtn').innerHTML = open ? '&#10005;' : '&#9776;';
  }
  function closeNav(){
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('scrim').classList.remove('show');
    document.getElementById('menuBtn').setAttribute('aria-expanded','false');
    setMenuIcon(false);
  }
  function openNav(){
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('scrim').classList.add('show');
    document.getElementById('menuBtn').setAttribute('aria-expanded','true');
    setMenuIcon(true);
  }

  document.getElementById('menuBtn').addEventListener('click', function(){
    var open = document.getElementById('sidebar').classList.contains('open');
    if (open) closeNav(); else openNav();
  });
  document.getElementById('scrim').addEventListener('click', closeNav);

  applyTheme();
  renderAll();
  setMenuIcon(false);
})();
</script>
